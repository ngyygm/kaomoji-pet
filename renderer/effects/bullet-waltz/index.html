<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title> </title>
  <style>
    * { margin: 0; padding: 0; user-select: none; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100%; height: 100%; }
    #center-char {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: white;
      pointer-events: none;
      animation: rotateCenter 8s linear infinite, pulseCenter 2s ease-in-out infinite;
      transition: opacity 600ms ease-out, color 200ms ease, text-shadow 200ms ease;
      z-index: 10;
    }
    @keyframes rotateCenter {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes pulseCenter {
      0%, 100% { scale: 1; }
      50% { scale: 1.1; }
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="center-char">(=^・ω・^=)</div>
  <script src="../_shared/effect-runtime.js"></script>
  <script>
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('show-bullet-waltz', (event, { duration } = {}) => {
      const runtime = EffectRuntime.createRuntime({
        id: 'bullet-waltz',
        adaptiveQuality: true,
        minQuality: 0.48,
        targetFps: 60
      });
      const { ctx } = EffectRuntime.createHiDpiCanvas(document.getElementById('fx'));
      const EFFECT_DURATION = duration || 16000;
      const screenW = () => window.innerWidth;
      const screenH = () => window.innerHeight;
      const cx = () => screenW() / 2;
      const cy = () => screenH() / 2;

      const centerEl = document.getElementById('center-char');
      const CENTER_KAOMOJI = [
        '(=^・ω・^=)', '(✧◡✧)', '(ﾉ´▽｀)ﾉ♪', '٩(๑❛ᴗ❛๑)۶',
        '(๑>◡<๑)', '(・ω<)☆', '(｡♥ᴗ♥｡)', '(ง •̀_•́)ง',
        '(ﾉ≧∀≦)ﾉ', '＼(＾▽＾)／', '(｡◕‿◕｡)', '(★^O^★)'
      ];
      const CENTER_COLORS = ['#ffffff', '#fde68a', '#f9a8d4', '#93c5fd', '#86efac', '#c084fc', '#67e8f9', '#fb923c'];
      const PALETTES = {
        SPIRAL: ['#67e8f9', '#93c5fd', '#a78bfa', '#22d3ee'],
        HEART: ['#f9a8d4', '#f472b6', '#f87171', '#fb7185'],
        PETALS: ['#c084fc', '#e879f9', '#f0abfc', '#818cf8'],
        FAN: ['#fde68a', '#fbbf24', '#86efac', '#34d399'],
        COMET: ['#fef3c7', '#fca5a5', '#fdba74', '#f9a8d4'],
        LATTICE: ['#a7f3d0', '#67e8f9', '#bfdbfe', '#ddd6fe']
      };
      const PHASES = ['SPIRAL', 'HEART', 'PETALS', 'FAN', 'COMET', 'LATTICE'];
      const PHASE_DURATION = 2200;

      let bullets = [];
      let ghosts = [];
      let frame = 0;
      let phaseIndex = 0;
      let phaseStart = 0;
      let spiralAngle = 0;
      let heartRotation = 0;
      let petalRotation = 0;
      let petalTimer = 0;
      let fanAngle = 0;
      let fanTimer = 0;
      let cometTimer = 0;
      let latticeTimer = 0;
      let startedAt = performance.now();
      let closing = false;

      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      function updateCenterCharacter(forceBig = false) {
        const color = pick(CENTER_COLORS);
        centerEl.textContent = pick(CENTER_KAOMOJI);
        centerEl.style.color = color;
        centerEl.style.fontSize = (forceBig ? 54 + Math.random() * 18 : 42 + Math.random() * 18) + 'px';
        centerEl.style.textShadow = `0 0 18px ${color}, 0 0 42px ${color}`;
        centerEl.style.filter = `hue-rotate(${Math.floor(Math.random() * 360)}deg)`;
      }

      function spawnBullet(x, y, vx, vy, symbol, color, size, maxLife) {
        bullets.push({ x, y, vx, vy, symbol, color, size, life: 0, maxLife: maxLife || 220 });
      }

      function spawnGhost(b) {
        ghosts.push({ x: b.x, y: b.y, symbol: b.symbol, color: b.color, size: b.size, life: 0, maxLife: 20 });
      }

      function updateSpiral() {
        if (frame % 3 !== 0) return;
        for (let arm = 0; arm < runtime.scaleCount(6, 4); arm++) {
          const angle = spiralAngle + (arm * Math.PI / 3);
          const speed = 3.4 + arm * 0.18;
          spawnBullet(cx(), cy(), Math.cos(angle) * speed, Math.sin(angle) * speed, ['✧', '✦', '✺'][arm % 3], pick(PALETTES.SPIRAL), 42 + arm * 2, 230);
        }
        spiralAngle += (18 * Math.PI) / 180;
      }

      function updateHeart() {
        if (frame % 55 !== 0) return;
        const count = runtime.scaleCount(48, 30);
        for (let i = 0; i < count; i++) {
          const t = (i / count) * 2 * Math.PI;
          const hx = 16 * Math.pow(Math.sin(t), 3);
          const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
          const rx = hx * Math.cos(heartRotation) - hy * Math.sin(heartRotation);
          const ry = hx * Math.sin(heartRotation) + hy * Math.cos(heartRotation);
          const dist = Math.max(1, Math.hypot(rx, ry));
          spawnBullet(cx(), cy(), rx / dist * 2.6, ry / dist * 2.6, i % 3 === 0 ? '♥' : '♡', pick(PALETTES.HEART), 38 + (i % 4) * 3, 220);
        }
        heartRotation += 0.45;
      }

      function updatePetals() {
        petalTimer++;
        if (petalTimer < 70) return;
        petalTimer = 0;
        const count = runtime.scaleCount(84, 52);
        for (let i = 0; i < count; i++) {
          const theta = (i / count) * 2 * Math.PI;
          const r = Math.cos(7 * theta);
          if (r <= 0) continue;
          const px = r * Math.cos(theta);
          const py = r * Math.sin(theta);
          const rx = px * Math.cos(petalRotation) - py * Math.sin(petalRotation);
          const ry = px * Math.sin(petalRotation) + py * Math.cos(petalRotation);
          const dist = Math.max(1, Math.hypot(rx, ry));
          spawnBullet(cx(), cy(), rx / dist * 2.2, ry / dist * 2.2, ['✿', '❁', '✾', '✧'][i % 4], pick(PALETTES.PETALS), 32 + (i % 5) * 3, 240);
        }
        petalRotation += 7 * (Math.PI / 180);
      }

      function updateFan() {
        fanTimer++;
        if (fanTimer % 2 === 0) {
          const totalStreams = runtime.scaleCount(14, 9);
          const fanSpread = 170 * (Math.PI / 180);
          const startAngle = fanAngle - fanSpread / 2;
          for (let i = 0; i < totalStreams; i++) {
            const angle = startAngle + (i / Math.max(1, totalStreams - 1)) * fanSpread;
            const speed = 3.7 + (i % 3) * 0.35;
            spawnBullet(cx(), cy(), Math.cos(angle) * speed, Math.sin(angle) * speed, ['♪', '♫', '★', '✦'][i % 4], pick(PALETTES.FAN), 36 + (i % 4) * 3, 190);
          }
        }
        fanAngle += 1.7 * (Math.PI / 180);
      }

      function updateComet() {
        cometTimer++;
        if (cometTimer % 3 !== 0) return;
        const lanes = runtime.scaleCount(10, 6);
        const base = (cometTimer * 0.08) % (Math.PI * 2);
        for (let lane = 0; lane < lanes; lane++) {
          const angle = base + lane * Math.PI * 2 / lanes;
          const offset = 120 + Math.sin(cometTimer * 0.04 + lane) * 70;
          const sx = cx() + Math.cos(angle) * offset;
          const sy = cy() + Math.sin(angle) * offset;
          const dist = Math.max(1, Math.hypot(cx() - sx, cy() - sy));
          const speed = 4.6 + lane * 0.12;
          spawnBullet(sx, sy, (cx() - sx) / dist * speed, (cy() - sy) / dist * speed, lane % 2 ? '✹' : '✶', pick(PALETTES.COMET), 34, 160);
        }
      }

      function updateLattice() {
        latticeTimer++;
        if (latticeTimer % 9 !== 0) return;
        const rows = 5;
        const cols = runtime.scaleCount(9, 6);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = (screenW() / (cols + 1)) * (c + 1);
            const y = (screenH() / (rows + 1)) * (r + 1);
            const angle = Math.atan2(y - cy(), x - cx()) + Math.sin(frame * 0.05) * 0.5;
            const speed = 2.4 + ((r + c) % 4) * 0.28;
            spawnBullet(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, '◇', pick(PALETTES.LATTICE), 30, 150);
          }
        }
      }

      const updaters = { SPIRAL: updateSpiral, HEART: updateHeart, PETALS: updatePetals, FAN: updateFan, COMET: updateComet, LATTICE: updateLattice };

      function drawGlyph(item, opacity) {
        ctx.globalAlpha = opacity;
        ctx.font = `${item.size}px "Segoe UI Emoji", "Apple Color Emoji", "Microsoft YaHei", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = item.color;
        ctx.shadowColor = item.color;
        ctx.shadowBlur = 12 * runtime.state.quality;
        ctx.fillText(item.symbol, item.x, item.y);
      }

      function fadeAndClose() {
        closing = true;
        runtime.stop();
        centerEl.style.opacity = '0';
        document.getElementById('fx').style.transition = 'opacity 600ms ease-out';
        document.getElementById('fx').style.opacity = '0';
        setTimeout(() => window.close(), 700);
      }

      updateCenterCharacter(true);
      runtime.requestEffectFrame((now) => {
        if (closing) return;
        frame++;
        const elapsed = now - startedAt;
        if (elapsed >= EFFECT_DURATION) {
          fadeAndClose();
          return;
        }

        if (frame - phaseStart >= PHASE_DURATION / (1000 / 60)) {
          phaseIndex = (phaseIndex + 1) % PHASES.length;
          phaseStart = frame;
          updateCenterCharacter(true);
          if (PHASES[phaseIndex] === 'FAN') fanTimer = 0;
        }
        if (frame % 38 === 0) updateCenterCharacter(false);

        updaters[PHASES[phaseIndex]]();

        ctx.clearRect(0, 0, screenW(), screenH());
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.x += b.vx;
          b.y += b.vy;
          b.life++;
          if (b.life % Math.round(3 / Math.max(0.6, runtime.state.quality)) === 0 && b.life < b.maxLife * 0.7 && runtime.chance(1)) {
            spawnGhost(b);
          }
          drawGlyph(b, 0.8 * (1 - b.life / b.maxLife));
          if (b.x < -80 || b.x > screenW() + 80 || b.y < -80 || b.y > screenH() + 80 || b.life >= b.maxLife) {
            bullets.splice(i, 1);
          }
        }
        for (let i = ghosts.length - 1; i >= 0; i--) {
          const g = ghosts[i];
          g.life++;
          drawGlyph(g, 0.45 * (1 - g.life / g.maxLife));
          if (g.life >= g.maxLife) ghosts.splice(i, 1);
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      });
    });
  </script>
</body>
</html>
