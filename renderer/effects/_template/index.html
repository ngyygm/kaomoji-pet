<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Custom Effect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #effect { position: fixed; inset: 0; display: grid; place-items: center; font-size: 64px; }
  </style>
</head>
<body>
  <div id="effect">✨</div>
  <script>
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('effect:start', (event, { duration, params }) => {
      const el = document.getElementById('effect');
      el.textContent = params.symbol || '✨';
      setTimeout(() => window.close(), duration || 5000);
    });
  </script>
</body>
</html>
