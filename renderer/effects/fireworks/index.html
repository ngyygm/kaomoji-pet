<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title> </title>
  <style>
    * { margin: 0; padding: 0; user-select: none; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; border: none; outline: none; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <script src="../_shared/effect-runtime.js"></script>
  <script>
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('show-fireworks', (event, opts = {}) => startShow(opts.duration || 16000));

    function startShow(duration) {
      const runtime = EffectRuntime.createRuntime({ id: 'fireworks', adaptiveQuality: true, minQuality: 0.46, targetFps: 60 });
      const { ctx } = EffectRuntime.createHiDpiCanvas(document.getElementById('fx'));
      const W = () => window.innerWidth;
      const H = () => window.innerHeight;
      let shells = [];
      let particles = [];
      let subShells = [];
      let ghosts = [];
      let flashes = [];
      let baseHue = Math.random() * 360;
      let nextLaunchTime = performance.now() + 160;
      const startedAt = performance.now();

      function rand(a, b) { return a + Math.random() * (b - a); }
      function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function hsl(h, s, l) { return `hsl(${Math.round(h / 5) * 5}, ${s}%, ${l}%)`; }

      // ─── Kaomoji character pools — 纯 Unicode 文字符号，不含 emoji ───
      const KAO_CHARS = {
        sparkle: ['★','☆','✧','✦','✵','✶','✺','✻','✼','❋','⋆','˚','✾','✤','✥'],
        heart:   ['♡','♥','ღ','❣','♡','♥','ღ','❣','♡','♥','ღ','❣','♡','♥','ღ'],
        soft:    ['✿','❀','❁','❃','✾','❆','❅','✤','✥','˚','°','・','✿','❀','❁'],
        face:    ['◕','◉','●','♡','ᴗ','ᴥ','▽','ω','‿','ʘ','ツ','◡','◠','≦','≧','⊙'],
        mixed:   ['★','♡','☆','✿','♪','♥','✦','❀','•','ᴗ','ω','♫','⋆','❋','✧'],
        star:    ['⋆','˚','✺','✻','✼','✧','✦','✵','✶','★','☆','❋','✾','✤','✥'],
        fire:    ['♪','♫','✧','✦','✺','✻','✼','✵','✶','★','☆','❋','✾','✧','✦'],
        sakura:  ['✿','❀','❁','❃','✾','❆','❅','✤','✥','❋','✺','✻','✿','❀','✾'],
      };

      function getPhase(elapsed) {
        const t = elapsed / duration;
        if (t < 0.25) return 'warmup';
        if (t < 0.65) return 'peak';
        if (t < 0.85) return 'finale';
        return 'cooldown';
      }

      function getLaunchInterval(phase) {
        const quality = Math.max(0.55, runtime.state.quality);
        const scale = 1 / quality;
        if (phase === 'warmup') return rand(600, 900) * scale;
        if (phase === 'peak') return rand(360, 620) * scale;
        if (phase === 'finale') return rand(160, 320) * scale;
        return rand(600, 900) * scale;
      }

      function launchShell() {
        const x = rand(W() * 0.1, W() * 0.9);
        const y = H() - 20;
        baseHue = (baseHue + rand(40, 80)) % 360;
        shells.push({
          x, y,
          startX: x,
          startY: y,
          targetY: rand(H() * 0.1, H() * 0.5),
          riseDuration: rand(1100, 1800),
          startTime: performance.now(),
          hue: baseHue,
          color: hsl(baseHue, 90, 80),
          burstType: pick(['chrysanthemum', 'willow', 'heart', 'double-ring', 'peony', 'starfall', 'cascade', 'sakura', 'chrysanthemum', 'peony', 'starfall']),
          isCluster: Math.random() < 0.35,
          wobble: rand(0, Math.PI * 2),
          trailTimer: 0
        });
      }

      // 粒子数超过阈值时，新增粒子自动降级为圆点（保帧率）
      const MAX_KAO_PARTICLES = 150;

      function addParticle(x, y, vx, vy, color, hue, size, maxLife, gravity, friction, opts = {}) {
        const useKao = particles.length < MAX_KAO_PARTICLES;
        particles.push({
          x, y, vx, vy, color, hue, size,
          char: useKao ? (opts.char || pick(KAO_CHARS.mixed)) : null,
          life: 0, maxLife, gravity, friction,
          trailInterval: opts.trailInterval || 3,
          colorShift: opts.colorShift,
          colorShiftAt: opts.colorShiftAt || 30,
          cascadeBurstLife: opts.cascadeBurstLife || 0,
          wobbleAmp: opts.wobbleAmp || 0,
          wobbleFreq: opts.wobbleFreq || 0,
        });
      }

      // ─── Burst Types ───

      function burstChrysanthemum(x, y, hue) {
        const count = runtime.scaleCount(randInt(50, 70), 30);
        for (let i = 0; i < count; i++) {
          const a = (Math.PI * 2 / count) * i + rand(-0.05, 0.05);
          const pHue = hue + rand(-15, 15);
          addParticle(x, y, Math.cos(a) * rand(5.5, 11), Math.sin(a) * rand(5.5, 11), hsl(pHue, 85, 65), pHue, rand(5, 9), rand(80, 120), 0.03, 0.97, { trailInterval: 3, char: pick(KAO_CHARS.sparkle) });
        }
      }

      function burstWillow(x, y, hue) {
        const colors = ['#fde68a', '#fbbf24', '#fb923c'];
        const count = runtime.scaleCount(randInt(38, 55), 24);
        for (let i = 0; i < count; i++) {
          const a = -Math.PI / 2 + rand(-1.2, 1.2);
          addParticle(x, y, Math.cos(a) * rand(8, 14), Math.sin(a) * rand(8, 14), pick(colors), hue, rand(5, 9), rand(90, 140), 0.08, 0.97, { trailInterval: 3, char: pick(KAO_CHARS.soft) });
        }
      }

      function burstHeart(x, y, hue) {
        const colors = ['#f9a8d4', '#f472b6', '#f87171', '#e879f9'];
        const count = runtime.scaleCount(40, 24);
        for (let i = 0; i < count; i++) {
          const t = (Math.PI * 2 / count) * i;
          const hx = 16 * Math.pow(Math.sin(t), 3) * 8;
          const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 8;
          const len = Math.max(1, Math.hypot(hx, hy));
          addParticle(x, y, hx / len * 5.5, hy / len * 5.5, pick(colors), hue, rand(5, 9), rand(70, 110), 0.02, 0.96, { trailInterval: 3, char: pick(KAO_CHARS.heart) });
        }
      }

      function burstDoubleRing(x, y, hue) {
        const rings = [{ count: 15, speed: 4.5, hue }, { count: 22, speed: 7.0, hue: (hue + 150) % 360 }];
        for (const ring of rings) {
          const count = runtime.scaleCount(ring.count, Math.ceil(ring.count * 0.65));
          for (let i = 0; i < count; i++) {
            const a = Math.PI * 2 / count * i;
            addParticle(x, y, Math.cos(a) * ring.speed, Math.sin(a) * ring.speed, hsl(ring.hue, 85, 65), ring.hue, rand(5, 9), rand(70, 100), 0.03, 0.96, { trailInterval: 3, char: pick(KAO_CHARS.sparkle) });
          }
        }
      }

      function burstPeony(x, y, hue) {
        const count = runtime.scaleCount(randInt(60, 82), 36);
        for (let i = 0; i < count; i++) {
          const a = rand(0, Math.PI * 2);
          const pHue = hue + rand(-15, 15);
          addParticle(x, y, Math.cos(a) * rand(7, 13), Math.sin(a) * rand(7, 13), hsl(pHue, 80, 55), pHue, rand(5, 10), rand(80, 130), 0.04, 0.97, { colorShift: true, colorShiftAt: 30, char: pick(KAO_CHARS.face) });
        }
      }

      // ── 满天星：炸开后满天缓慢飘落的细碎星点 ──
      function burstStarFall(x, y, hue) {
        const count = runtime.scaleCount(randInt(80, 120), 45);
        for (let i = 0; i < count; i++) {
          const a = rand(0, Math.PI * 2);
          const pHue = hue + rand(-30, 30);
          addParticle(x, y, Math.cos(a) * rand(2, 6), Math.sin(a) * rand(2, 6), hsl(pHue, 80, 75), pHue, rand(2, 4), rand(160, 220), 0.008, 0.985, { trailInterval: 5, colorShift: true, colorShiftAt: 40, char: pick(KAO_CHARS.star) });
        }
        flashes.push({ color: hsl(hue, 90, 85), alpha: 0.2, life: 0, maxLife: 18 });
      }

      // ── 瀑布/二次炸开：子弹飞出后各自再爆一次 ──
      function burstCascade(x, y, hue) {
        const count = runtime.scaleCount(randInt(28, 40), 18);
        for (let i = 0; i < count; i++) {
          const a = -Math.PI / 2 + rand(-1.4, 1.4);
          const pHue = hue + rand(-10, 10);
          addParticle(x, y, Math.cos(a) * rand(7, 11), Math.sin(a) * rand(7, 11), hsl(pHue, 85, 65), pHue, rand(5, 8), rand(50, 70), 0.06, 0.97, { trailInterval: 2, cascadeBurstLife: randInt(22, 32), char: pick(KAO_CHARS.fire) });
        }
        flashes.push({ color: hsl(hue, 90, 80), alpha: 0.18, life: 0, maxLife: 14 });
      }

      // ── 樱花散落：缓缓飘落的粉色花瓣 ──
      function burstSakura(x, y, hue) {
        const colors = ['#fce4ec', '#f8bbd0', '#f48fb1', '#ec407a', '#f06292'];
        const count = runtime.scaleCount(randInt(45, 65), 28);
        for (let i = 0; i < count; i++) {
          const a = rand(0, Math.PI * 2);
          addParticle(x, y, Math.cos(a) * rand(4, 9), Math.sin(a) * rand(4, 9), pick(colors), hue, rand(5, 8), rand(100, 150), 0.015, 0.975, { trailInterval: 4, wobbleAmp: 0.15, wobbleFreq: 0.08, char: pick(KAO_CHARS.sakura) });
        }
      }

      function miniBurst(x, y, hue) {
        const count = runtime.scaleCount(randInt(16, 22), 8);
        for (let i = 0; i < count; i++) {
          const a = rand(0, Math.PI * 2);
          const pHue = hue + rand(-15, 15);
          addParticle(x, y, Math.cos(a) * rand(3.5, 7), Math.sin(a) * rand(3.5, 7), hsl(pHue, 85, 70), pHue, rand(4, 6), rand(40, 70), 0.04, 0.96, { trailInterval: 4, char: pick(KAO_CHARS.mixed) });
        }
      }

      function burstShell(s) {
        flashes.push({ color: s.color, alpha: 0.15, life: 0, maxLife: 12 });
        if (s.isCluster && runtime.chance(1)) {
          const count = runtime.scaleCount(randInt(7, 12), 5);
          for (let i = 0; i < count; i++) {
            const a = (Math.PI * 2 / count) * i + rand(-0.2, 0.2);
            subShells.push({ x: s.x, y: s.y, vx: Math.cos(a) * rand(4, 7), vy: Math.sin(a) * rand(4, 7), hue: s.hue + rand(-20, 20), burstTime: performance.now() + rand(300, 550), color: hsl(s.hue, 90, 70) });
          }
          return;
        }
        const fn = { chrysanthemum: burstChrysanthemum, willow: burstWillow, heart: burstHeart, 'double-ring': burstDoubleRing, peony: burstPeony, starfall: burstStarFall, cascade: burstCascade, sakura: burstSakura }[s.burstType];
        (fn || burstChrysanthemum)(s.x, s.y, s.hue);
      }

      function drawDot(x, y, size, color, alpha, blur = 0, char) {
        const fontSize = Math.max(10, Math.round(size * 7));
        const font = `${fontSize}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
        if (char) {
          runtime.drawGlowText(ctx, char, x, y, font, color, alpha, blur * 1.5);
        } else {
          runtime.drawDot(ctx, x, y, size, color, alpha, blur);
        }
      }

      runtime.requestEffectFrame((now, state, skipRender) => {
        const elapsed = now - startedAt;
        const phase = getPhase(elapsed);

        if (now >= nextLaunchTime && elapsed < duration * 0.92) {
          launchShell();
          if (phase === 'finale') {
            if (runtime.chance(0.85)) launchShell();
            if (runtime.chance(0.5)) launchShell();
          }
          nextLaunchTime = now + getLaunchInterval(phase);
        }

        ctx.clearRect(0, 0, W(), H());

        // Flashes — skip when frame-starved
        if (!skipRender) {
          for (let i = flashes.length - 1; i >= 0; i--) {
            const f = flashes[i];
            f.life++;
            drawDot(W() / 2, H() / 2, Math.max(W(), H()), f.color, f.alpha * (1 - f.life / f.maxLife), 0, null);
            if (f.life >= f.maxLife) EffectRuntime.removeAt(flashes, i);
          }
        }

        // Shells (rising)
        for (let i = shells.length - 1; i >= 0; i--) {
          const s = shells[i];
          const p = Math.min((now - s.startTime) / s.riseDuration, 1);
          const eased = 1 - (1 - p) * (1 - p);
          s.x = s.startX + Math.sin(s.wobble + (now - s.startTime) * 0.008) * 3;
          s.y = s.startY + (s.targetY - s.startY) * eased;
          drawDot(s.x, s.y, 3, s.color, 1, 12, '↑');
          s.trailTimer++;
          if (!skipRender && s.trailTimer % 3 === 0 && runtime.chance(0.6)) ghosts.push({ x: s.x, y: s.y + 2, size: 2, color: s.color, life: 0, maxLife: 18 });
          if (p >= 1) {
            burstShell(s);
            EffectRuntime.removeAt(shells, i);
          }
        }

        // Sub-shells
        for (let i = subShells.length - 1; i >= 0; i--) {
          const ss = subShells[i];
          ss.x += ss.vx; ss.y += ss.vy; ss.vy += 0.03; ss.vx *= 0.98; ss.vy *= 0.98;
          drawDot(ss.x, ss.y, 4, ss.color, 0.9, 9, null);
          if (now >= ss.burstTime) {
            miniBurst(ss.x, ss.y, ss.hue);
            EffectRuntime.removeAt(subShells, i);
          }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.vx *= p.friction; p.vy *= p.friction; p.vy += p.gravity;
          // Sakura wobble
          if (p.wobbleAmp) p.vx += Math.sin(p.life * p.wobbleFreq) * p.wobbleAmp;
          p.x += p.vx; p.y += p.vy; p.life++;
          if (p.colorShift && p.life === p.colorShiftAt) {
            p.hue = (p.hue + 40) % 360;
            p.color = hsl(p.hue, 80, 65);
          }
          // Cascade: trigger miniBurst at appointed frame
          if (p.cascadeBurstLife && p.life === p.cascadeBurstLife) {
            miniBurst(p.x, p.y, p.hue);
            p.cascadeBurstLife = 0; // only burst once
          }
          const alpha = Math.max(0, 1 - p.life / p.maxLife);
          drawDot(p.x, p.y, p.size, p.color, alpha, p.size + 2, p.char);
          if (!skipRender && particles.length < 180 && p.life % Math.round(Math.max(1, p.trailInterval / Math.max(0.6, runtime.state.quality))) === 0 && alpha > 0.35 && runtime.chance(0.35)) {
            ghosts.push({ x: p.x, y: p.y, size: Math.max(1, p.size * 0.5), color: p.color, life: 0, maxLife: 16 });
          }
          if (p.life >= p.maxLife) EffectRuntime.removeAt(particles, i);
        }

        // Ghosts — skip entirely when frame-starved
        if (!skipRender) {
          for (let i = ghosts.length - 1; i >= 0; i--) {
            const g = ghosts[i];
            g.life++;
            drawDot(g.x, g.y, g.size, g.color, 0.4 * (1 - g.life / g.maxLife), 3, null);
            if (g.life >= g.maxLife) EffectRuntime.removeAt(ghosts, i);
          }
        } else {
          // Even when skipping render, still age and kill ghosts to avoid memory buildup
          for (let i = ghosts.length - 1; i >= 0; i--) {
            ghosts[i].life += 2; // age faster so they die sooner
            if (ghosts[i].life >= ghosts[i].maxLife) EffectRuntime.removeAt(ghosts, i);
          }
        }

        if (elapsed >= duration && shells.length === 0 && particles.length === 0 && subShells.length === 0) {
          runtime.stop();
          document.getElementById('fx').style.transition = 'opacity 800ms ease-out';
          document.getElementById('fx').style.opacity = '0';
          setTimeout(() => window.close(), 900);
        }
      });
    }
  </script>
</body>
</html>
