<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title> </title>
  <style>
    * { margin: 0; padding: 0; user-select: none; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; border: none; outline: none; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <script src="../_shared/effect-runtime.js"></script>
  <script>
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('show-fireworks', (event, opts = {}) => startShow(opts.duration || 16000));

    function startShow(duration) {
      const runtime = EffectRuntime.createRuntime({ id: 'fireworks', adaptiveQuality: true, minQuality: 0.46, targetFps: 60 });
      const { ctx } = EffectRuntime.createHiDpiCanvas(document.getElementById('fx'));
      const W = () => window.innerWidth;
      const H = () => window.innerHeight;
      let shells = [];
      let particles = [];
      let subShells = [];
      let ghosts = [];
      let flashes = [];
      let baseHue = Math.random() * 360;
      let nextLaunchTime = performance.now() + 160;
      const startedAt = performance.now();

      function rand(a, b) { return a + Math.random() * (b - a); }
      function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function hsl(h, s, l) { return `hsl(${h}, ${s}%, ${l}%)`; }

      function getPhase(elapsed) {
        const t = elapsed / duration;
        if (t < 0.25) return 'warmup';
        if (t < 0.65) return 'peak';
        if (t < 0.85) return 'finale';
        return 'cooldown';
      }

      function getLaunchInterval(phase) {
        const quality = Math.max(0.55, runtime.state.quality);
        const scale = 1 / quality;
        if (phase === 'warmup') return rand(600, 900) * scale;
        if (phase === 'peak') return rand(360, 620) * scale;
        if (phase === 'finale') return rand(160, 320) * scale;
        return rand(600, 900) * scale;
      }

      function launchShell() {
        const x = rand(W() * 0.1, W() * 0.9);
        const y = H() - 20;
        baseHue = (baseHue + rand(40, 80)) % 360;
        shells.push({
          x, y,
          startX: x,
          startY: y,
          targetY: rand(H() * 0.1, H() * 0.5),
          riseDuration: rand(1100, 1800),
          startTime: performance.now(),
          hue: baseHue,
          color: hsl(baseHue, 90, 80),
          burstType: pick(['chrysanthemum', 'willow', 'heart', 'double-ring', 'peony', 'chrysanthemum', 'peony']),
          isCluster: Math.random() < 0.35,
          wobble: rand(0, Math.PI * 2),
          trailTimer: 0
        });
      }

      function addParticle(x, y, vx, vy, color, hue, size, maxLife, gravity, friction, opts = {}) {
        particles.push({ x, y, vx, vy, color, hue, size, life: 0, maxLife, gravity, friction, trailInterval: opts.trailInterval || 3, colorShift: opts.colorShift, colorShiftAt: opts.colorShiftAt || 30 });
      }

      function burstChrysanthemum(x, y, hue) {
        const count = runtime.scaleCount(randInt(70, 95), 42);
        for (let i = 0; i < count; i++) {
          const a = (Math.PI * 2 / count) * i + rand(-0.05, 0.05);
          const pHue = hue + rand(-15, 15);
          addParticle(x, y, Math.cos(a) * rand(4, 8), Math.sin(a) * rand(4, 8), hsl(pHue, 85, 65), pHue, rand(3, 5), rand(80, 120), 0.03, 0.97, { trailInterval: 2 });
        }
      }

      function burstWillow(x, y, hue) {
        const colors = ['#fde68a', '#fbbf24', '#fb923c'];
        const count = runtime.scaleCount(randInt(52, 72), 32);
        for (let i = 0; i < count; i++) {
          const a = -Math.PI / 2 + rand(-1.2, 1.2);
          addParticle(x, y, Math.cos(a) * rand(6, 10), Math.sin(a) * rand(6, 10), pick(colors), hue, rand(3, 5), rand(90, 140), 0.08, 0.97, { trailInterval: 2 });
        }
      }

      function burstHeart(x, y, hue) {
        const colors = ['#f9a8d4', '#f472b6', '#f87171', '#e879f9'];
        const count = runtime.scaleCount(54, 34);
        for (let i = 0; i < count; i++) {
          const t = (Math.PI * 2 / count) * i;
          const hx = 16 * Math.pow(Math.sin(t), 3) * 8;
          const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 8;
          const len = Math.max(1, Math.hypot(hx, hy));
          addParticle(x, y, hx / len * 4.2, hy / len * 4.2, pick(colors), hue, rand(3, 5), rand(70, 110), 0.02, 0.96, { trailInterval: 3 });
        }
      }

      function burstDoubleRing(x, y, hue) {
        const rings = [{ count: 20, speed: 3.4, hue }, { count: 30, speed: 5.3, hue: (hue + 150) % 360 }];
        for (const ring of rings) {
          const count = runtime.scaleCount(ring.count, Math.ceil(ring.count * 0.65));
          for (let i = 0; i < count; i++) {
            const a = Math.PI * 2 / count * i;
            addParticle(x, y, Math.cos(a) * ring.speed, Math.sin(a) * ring.speed, hsl(ring.hue, 85, 65), ring.hue, rand(3, 5), rand(70, 100), 0.03, 0.96, { trailInterval: 3 });
          }
        }
      }

      function burstPeony(x, y, hue) {
        const count = runtime.scaleCount(randInt(86, 118), 52);
        for (let i = 0; i < count; i++) {
          const a = rand(0, Math.PI * 2);
          const pHue = hue + rand(-15, 15);
          addParticle(x, y, Math.cos(a) * rand(5, 10), Math.sin(a) * rand(5, 10), hsl(pHue, 80, 55), pHue, rand(3, 6), rand(80, 130), 0.04, 0.97, { colorShift: true, colorShiftAt: 30 });
        }
      }

      function miniBurst(x, y, hue) {
        const count = runtime.scaleCount(randInt(24, 34), 14);
        for (let i = 0; i < count; i++) {
          const a = rand(0, Math.PI * 2);
          const pHue = hue + rand(-15, 15);
          addParticle(x, y, Math.cos(a) * rand(2.4, 5.2), Math.sin(a) * rand(2.4, 5.2), hsl(pHue, 85, 70), pHue, rand(2, 4), rand(40, 70), 0.04, 0.96, { trailInterval: 4 });
        }
      }

      function burstShell(s) {
        flashes.push({ color: s.color, alpha: 0.15, life: 0, maxLife: 12 });
        if (s.isCluster && runtime.chance(1)) {
          const count = runtime.scaleCount(randInt(7, 12), 5);
          for (let i = 0; i < count; i++) {
            const a = (Math.PI * 2 / count) * i + rand(-0.2, 0.2);
            subShells.push({ x: s.x, y: s.y, vx: Math.cos(a) * rand(4, 7), vy: Math.sin(a) * rand(4, 7), hue: s.hue + rand(-20, 20), burstTime: performance.now() + rand(300, 550), color: hsl(s.hue, 90, 70) });
          }
          return;
        }
        if (s.burstType === 'willow') burstWillow(s.x, s.y, s.hue);
        else if (s.burstType === 'heart') burstHeart(s.x, s.y, s.hue);
        else if (s.burstType === 'double-ring') burstDoubleRing(s.x, s.y, s.hue);
        else if (s.burstType === 'peony') burstPeony(s.x, s.y, s.hue);
        else burstChrysanthemum(s.x, s.y, s.hue);
      }

      function drawDot(x, y, size, color, alpha, blur = 0) {
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = blur * runtime.state.quality;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      runtime.requestEffectFrame((now) => {
        const elapsed = now - startedAt;
        const phase = getPhase(elapsed);

        if (now >= nextLaunchTime && elapsed < duration * 0.92) {
          launchShell();
          if (phase === 'finale') {
            if (runtime.chance(0.9)) launchShell();
            if (runtime.chance(0.65)) launchShell();
            if (runtime.chance(0.35)) launchShell();
          }
          nextLaunchTime = now + getLaunchInterval(phase);
        }

        ctx.clearRect(0, 0, W(), H());

        for (let i = flashes.length - 1; i >= 0; i--) {
          const f = flashes[i];
          f.life++;
          drawDot(W() / 2, H() / 2, Math.max(W(), H()), f.color, f.alpha * (1 - f.life / f.maxLife), 0);
          if (f.life >= f.maxLife) flashes.splice(i, 1);
        }

        for (let i = shells.length - 1; i >= 0; i--) {
          const s = shells[i];
          const p = Math.min((now - s.startTime) / s.riseDuration, 1);
          const eased = 1 - (1 - p) * (1 - p);
          s.x = s.startX + Math.sin(s.wobble + (now - s.startTime) * 0.008) * 3;
          s.y = s.startY + (s.targetY - s.startY) * eased;
          drawDot(s.x, s.y, 3, s.color, 1, 12);
          s.trailTimer++;
          if (s.trailTimer % 2 === 0 && runtime.chance(0.9)) ghosts.push({ x: s.x, y: s.y + 2, size: 2, color: s.color, life: 0, maxLife: 24 });
          if (p >= 1) {
            burstShell(s);
            shells.splice(i, 1);
          }
        }

        for (let i = subShells.length - 1; i >= 0; i--) {
          const ss = subShells[i];
          ss.x += ss.vx; ss.y += ss.vy; ss.vy += 0.03; ss.vx *= 0.98; ss.vy *= 0.98;
          drawDot(ss.x, ss.y, 4, ss.color, 0.9, 9);
          if (now >= ss.burstTime) {
            miniBurst(ss.x, ss.y, ss.hue);
            subShells.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.vx *= p.friction; p.vy *= p.friction; p.vy += p.gravity;
          p.x += p.vx; p.y += p.vy; p.life++;
          if (p.colorShift && p.life === p.colorShiftAt) {
            p.hue = (p.hue + 60) % 360;
            p.color = hsl(p.hue, 80, 55);
          }
          const alpha = Math.max(0, 1 - p.life / p.maxLife);
          drawDot(p.x, p.y, p.size, p.color, alpha, p.size + 2);
          if (p.life % Math.round(p.trailInterval / Math.max(0.6, runtime.state.quality)) === 0 && alpha > 0.3 && runtime.chance(0.8)) {
            ghosts.push({ x: p.x, y: p.y, size: Math.max(1, p.size * 0.6), color: p.color, life: 0, maxLife: 22 });
          }
          if (p.life >= p.maxLife) particles.splice(i, 1);
        }

        for (let i = ghosts.length - 1; i >= 0; i--) {
          const g = ghosts[i];
          g.life++;
          drawDot(g.x, g.y, g.size, g.color, 0.45 * (1 - g.life / g.maxLife), 4);
          if (g.life >= g.maxLife) ghosts.splice(i, 1);
        }

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;

        if (elapsed >= duration && shells.length === 0 && particles.length === 0 && subShells.length === 0) {
          runtime.stop();
          document.getElementById('fx').style.transition = 'opacity 800ms ease-out';
          document.getElementById('fx').style.opacity = '0';
          setTimeout(() => window.close(), 900);
        }
      });
    }
  </script>
</body>
</html>
