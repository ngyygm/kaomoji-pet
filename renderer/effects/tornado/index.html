<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title> </title>
  <style>
    * { margin: 0; padding: 0; user-select: none; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100%; height: 100%; }
    #vortex, #flash {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    #vortex {
      width: 900px;
      height: 900px;
      opacity: 0;
      background: conic-gradient(from 0deg, rgba(129,140,248,0.3), rgba(249,168,212,0.3), rgba(134,239,172,0.3), rgba(253,230,138,0.3), rgba(192,132,252,0.3), rgba(129,140,248,0.3));
      will-change: transform, opacity;
    }
    #flash {
      width: 1200px;
      height: 1200px;
      background: white;
      opacity: 0;
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="vortex"></div>
  <div id="flash"></div>
  <script src="../_shared/effect-runtime.js"></script>
  <script>
    const { ipcRenderer } = require('electron');

    const KAOMOJI_PARTS = [
      '(=^・ω・^=)', '(✪ω✪)', '(✧◡✧)', '(*ΦωΦ*)',
      'ฅ•̀∀•́ฅ', '(●\'ω\')旦', '(￣(∞)￣)', '(*^▽^*)',
      'U•ェ•*U', '(=①ω①=)', '(Θ３Θ)', '(✧ω✧)',
      '♡', '★', '✧', '♪', '✿', '❁', '☆', '♥',
      '♥', '♫', '✦', '❖', '✺', '⚡', '💫', '◈'
    ];
    const SCATTER_COLORS = ['#f9a8d4', '#818cf8', '#f87171', '#86efac', '#fde68a', '#93c5fd', '#c084fc', '#fb923c'];
    const EXPLOSION_FRAGMENTS = ['♡', '★', '✧', '♪', '✿', '❁', '☆', '♥', '♫', '✦', '❖', '✺', '⚡', '💫', '◈', '♦', '◉', '◇', '○', '◆', '□', '■', '△', '▽', '(', ')', '=', '^', 'ω', '~', '*', 'o'];

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function rand(min, max) { return min + Math.random() * (max - min); }
    function lerp(a, b, t) { return a + (b - a) * t; }

    ipcRenderer.on('show-tornado', (event, { duration } = {}) => {
      const runtime = EffectRuntime.createRuntime({ id: 'tornado', adaptiveQuality: true, minQuality: 0.48, targetFps: 60 });
      const { ctx } = EffectRuntime.createHiDpiCanvas(document.getElementById('fx'));
      const DURATION = duration || 14000;
      const W = () => window.innerWidth;
      const H = () => window.innerHeight;
      const CX = () => W() / 2;
      const CY = () => H() / 2;
      const PHASE1_END = 0.15;
      const PHASE2_END = 0.75;
      const startTime = performance.now();
      const vortexEl = document.getElementById('vortex');
      const flashEl = document.getElementById('flash');
      let scatter = [];
      let explosion = [];
      let ghosts = [];
      let flashDone = false;

      const scatterCount = runtime.scaleCount(52 + Math.floor(Math.random() * 18), 38);
      for (let i = 0; i < scatterCount; i++) {
        scatter.push({
          text: pick(KAOMOJI_PARTS),
          x: rand(50, W() - 50),
          y: rand(50, H() - 50),
          vx: rand(-1.8, 1.8),
          vy: rand(-1.8, 1.8),
          size: rand(72, 144),
          color: pick(SCATTER_COLORS),
          rotation: 0,
          rotSpeed: rand(-0.5, 0.5),
          popDelay: rand(0, DURATION * 0.08),
          absorbed: false,
          hue: 0
        });
      }

      function drawText(p, opacity, scale = 1, shadow = 18) {
        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation || 0);
        ctx.scale(scale, scale);
        ctx.font = `${p.size}px "Segoe UI Emoji", "Apple Color Emoji", "Microsoft YaHei", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = shadow * runtime.state.quality;
        ctx.fillText(p.text, 0, 0);
        ctx.restore();
      }

      function spawnGhost(p) {
        ghosts.push({ text: p.text, x: p.x, y: p.y, size: p.size, color: p.color, rotation: p.rotation, born: performance.now() });
      }

      runtime.requestEffectFrame((now, state) => {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / DURATION, 1);
        ctx.clearRect(0, 0, W(), H());

        if (progress < PHASE1_END) {
          for (const p of scatter) {
            if (elapsed < p.popDelay) continue;
            const popT = Math.min((elapsed - p.popDelay) / 400, 1);
            const scale = popT < 0.6 ? (popT / 0.6) * 1.15 : 1.15 - 0.15 * ((popT - 0.6) / 0.4);
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 10 || p.x > W() - 10) p.vx *= -1;
            if (p.y < 10 || p.y > H() - 10) p.vy *= -1;
            p.x = Math.max(10, Math.min(W() - 10, p.x));
            p.y = Math.max(10, Math.min(H() - 10, p.y));
            drawText(p, popT, scale, 10);
          }
        }

        if (progress >= PHASE1_END && progress < PHASE2_END) {
          const phaseProgress = (progress - PHASE1_END) / (PHASE2_END - PHASE1_END);
          const vortexOpacity = lerp(0.25, 0.55, phaseProgress);
          const vortexRotation = state.frame * 5.5;
          const vortexScale = lerp(1, 1.55, phaseProgress);
          vortexEl.style.opacity = vortexOpacity.toString();
          vortexEl.style.transform = `translate(-50%, -50%) rotate(${vortexRotation}deg) scale(${vortexScale})`;
          const attractionStrength = lerp(0.08, 1.18, phaseProgress);
          const baseTangentialSpeed = lerp(3.2, 8.5, phaseProgress);

          for (const p of scatter) {
            if (p.absorbed) continue;
            const dx = CX() - p.x;
            const dy = CY() - p.y;
            const dist = Math.max(1, Math.hypot(dx, dy));
            const nx = dx / dist;
            const ny = dy / dist;
            const tx = -ny;
            const ty = nx;
            const branchWave = Math.sin(state.frame * 0.08 + p.size * 0.1) * 0.55;
            const tangentialSpeed = baseTangentialSpeed * Math.max(1, 220 / Math.max(dist, 90));
            p.vx += nx * attractionStrength;
            p.vy += ny * attractionStrength;
            p.vx += tx * tangentialSpeed * (0.13 + branchWave * 0.03);
            p.vy += ty * tangentialSpeed * (0.13 + branchWave * 0.03);
            p.vx += Math.cos(state.frame * 0.12 + p.rotSpeed * 9) * 0.42;
            p.vy += Math.sin(state.frame * 0.11 + p.rotSpeed * 7) * 0.42;
            const speed = Math.hypot(p.vx, p.vy);
            if (speed > 24) {
              p.vx *= 24 / speed;
              p.vy *= 24 / speed;
            }
            p.x += p.vx;
            p.y += p.vy;
            p.rotation += p.rotSpeed + p.vx * 0.008;
            p.hue = (p.hue + 2) % 360;
            const scale = Math.max(0.05, lerp(1.0, 0.3, Math.max(0, 1 - dist / (Math.max(W(), H()) * 0.5))));
            const opacity = lerp(0.5, 1.0, 0.5 + 0.5 * Math.sin(state.frame * 0.1 + p.rotSpeed * 10));
            drawText(p, opacity, scale, 16);
            if (state.frame % Math.round(5 / Math.max(0.65, state.quality)) === 0 && phaseProgress > 0.25 && runtime.chance(0.8)) spawnGhost(p);
            if (dist < 70) p.absorbed = true;
          }
        }

        if (progress >= PHASE2_END) {
          const phaseProgress = (progress - PHASE2_END) / (1 - PHASE2_END);
          if (!flashDone) {
            flashDone = true;
            vortexEl.style.opacity = '0';
            flashEl.style.transition = 'opacity 0.1s ease-in';
            flashEl.style.opacity = '0.9';
            setTimeout(() => {
              flashEl.style.transition = 'opacity 0.1s ease-out';
              flashEl.style.opacity = '0';
            }, 100);
            const count = runtime.scaleCount(120 + Math.floor(Math.random() * 46), 72);
            for (let i = 0; i < count; i++) {
              const hue = Math.floor(rand(0, 360));
              const angle = rand(0, Math.PI * 2);
              const speed = rand(12, 30);
              explosion.push({
                text: pick(EXPLOSION_FRAGMENTS),
                x: CX(), y: CY(),
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: rand(48, 108),
                color: `hsl(${hue}, 90%, 65%)`,
                rotation: 0,
                rotSpeed: rand(-0.14, 0.14),
                ghostTimer: 0
              });
            }
          }

          for (let i = explosion.length - 1; i >= 0; i--) {
            const p = explosion[i];
            p.vx *= 0.98; p.vy *= 0.98;
            p.x += p.vx; p.y += p.vy;
            p.rotation += p.rotSpeed;
            p.rotSpeed *= 0.99;
            const opacity = Math.max(0, 1 - phaseProgress);
            drawText(p, opacity, 1, 24);
            p.ghostTimer++;
            if (p.ghostTimer >= Math.round(2 / Math.max(0.65, state.quality)) && opacity > 0.1 && runtime.chance(0.75)) {
              p.ghostTimer = 0;
              spawnGhost(p);
            }
            if (p.x < -80 || p.x > W() + 80 || p.y < -80 || p.y > H() + 80) explosion.splice(i, 1);
          }
        }

        for (let i = ghosts.length - 1; i >= 0; i--) {
          const g = ghosts[i];
          const age = now - g.born;
          if (age > 400) {
            ghosts.splice(i, 1);
          } else {
            drawText(g, 0.3 * (1 - age / 400), 1, 8);
          }
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;

        if (progress >= 1) {
          runtime.stop();
          vortexEl.style.opacity = '0';
          flashEl.style.opacity = '0';
          setTimeout(() => window.close(), 100);
        }
      });
    });
  </script>
</body>
</html>
