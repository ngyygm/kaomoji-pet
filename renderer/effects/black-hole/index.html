<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title> </title>
  <style>*{margin:0;padding:0;user-select:none}html,body{width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('effect:start', (event, payload) => start(payload?.duration || 12000));
    function start(duration) {
      const canvas = document.getElementById('fx'), ctx = canvas.getContext('2d');
      const W = canvas.width = window.innerWidth, H = canvas.height = window.innerHeight;
      const cx = W / 2, cy = H / 2;
      const faces = ['(=^・ω・^=)', '(；ﾟДﾟ)', '(>ω<)', '(ꈍᴗꈍ)', '(✧◡✧)', 'Σ(っ°Д°;)っ'];
      const colors = ['#f9a8d4', '#93c5fd', '#fde68a', '#86efac', '#c084fc'];
      const particles = Array.from({ length: 150 }, () => spawn(true));
      let startTime = performance.now();
      function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
      function spawn(anywhere=false) {
        const edge = Math.floor(Math.random() * 4);
        let x = anywhere ? Math.random() * W : (edge === 0 ? -60 : edge === 1 ? W + 60 : Math.random() * W);
        let y = anywhere ? Math.random() * H : (edge === 2 ? -60 : edge === 3 ? H + 60 : Math.random() * H);
        return { x, y, a: Math.random() * Math.PI * 2, r: Math.hypot(x - cx, y - cy), text: Math.random() < 0.28 ? pick(faces) : pick(['✦','★','✧','♡','◇']), color: pick(colors), size: 14 + Math.random() * 22, life: 1 };
      }
      function loop(now) {
        const elapsed = now - startTime, fade = Math.max(0, Math.min(1, (duration - elapsed) / 800));
        ctx.clearRect(0,0,W,H);
        const pulse = 1 + Math.sin(now * 0.004) * 0.12;
        const g = ctx.createRadialGradient(cx, cy, 8, cx, cy, 190 * pulse);
        g.addColorStop(0, 'rgba(0,0,0,0.95)');
        g.addColorStop(0.35, 'rgba(99,102,241,0.35)');
        g.addColorStop(0.62, 'rgba(244,114,182,0.14)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = fade; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 220 * pulse, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = `rgba(253,230,138,${0.65*fade})`; ctx.lineWidth = 2;
        for (let ring=0; ring<4; ring++) { ctx.beginPath(); ctx.ellipse(cx, cy, 70+ring*34, 25+ring*12, now*0.001+ring, 0, Math.PI*2); ctx.stroke(); }
        for (let i=particles.length-1;i>=0;i--) {
          const p = particles[i], dx = cx - p.x, dy = cy - p.y, d = Math.max(8, Math.hypot(dx,dy));
          const pull = 0.7 + 1500 / (d*d);
          p.a += 0.045 + 80 / (d*d);
          p.x += dx / d * pull + Math.cos(p.a) * 2.2;
          p.y += dy / d * pull + Math.sin(p.a) * 2.2;
          p.life -= d < 34 ? 0.08 : 0.001;
          ctx.globalAlpha = Math.max(0, p.life) * fade;
          ctx.font = `${p.size * Math.max(0.45, d / Math.max(W,H))}px "Segoe UI Emoji", sans-serif`;
          ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 14;
          ctx.fillText(p.text, p.x, p.y);
          if (p.life <= 0) particles[i] = spawn(false);
        }
        ctx.shadowBlur = 0;
        if (elapsed > duration * 0.68) {
          ctx.globalAlpha = fade * Math.sin(elapsed * 0.02) * 0.5 + 0.5;
          ctx.font = '46px "Segoe UI Emoji", sans-serif';
          ctx.fillStyle = '#fff'; ctx.fillText('(ﾉ≧∀≦)ﾉ', cx - 95, cy + 14);
        }
        if (elapsed < duration) requestAnimationFrame(loop); else window.close();
      }
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
