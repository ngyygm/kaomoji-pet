<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title> </title>
  <style>
    * { margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      border: none;
      outline: none;
    }
    #parade-container {
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .marcher {
      position: absolute;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
      white-space: nowrap;
      pointer-events: none;
      will-change: transform;
      transition: none;
    }
    .flag-symbol {
      position: absolute;
      font-size: 18px;
      pointer-events: none;
    }
    .flag-symbol .flag-inner {
      display: inline-block;
      animation: flagWave 0.6s ease-in-out infinite alternate;
    }
    @keyframes flagWave {
      0% { transform: translateX(-6px) rotate(-10deg); }
      100% { transform: translateX(6px) rotate(10deg); }
    }
    .dust-particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: dustFade 0.5s ease-out forwards;
    }
    @keyframes dustFade {
      0% { opacity: 0.5; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.2) translateY(-8px); }
    }
    .music-note {
      position: absolute;
      pointer-events: none;
      animation: noteFloat 1.2s ease-out forwards;
      font-size: 18px;
      opacity: 0;
    }
    @keyframes noteFloat {
      0% { opacity: 0.7; transform: translate(0, 0) scale(0.6); }
      60% { opacity: 0.5; }
      100% { opacity: 0; transform: translate(var(--note-tx), -60px) scale(1.2); }
    }
    .panic-mark {
      position: absolute;
      pointer-events: none;
      font-size: 22px;
      font-weight: bold;
      animation: panicPop 0.6s ease-out forwards;
      color: #fbbf24;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
    }
    @keyframes panicPop {
      0% { opacity: 0; transform: scale(0.3); }
      30% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0; transform: scale(0.8) translateY(-20px); }
    }
    .honor-sparkle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      animation: sparkleFloat 0.8s ease-out forwards;
    }
    @keyframes sparkleFloat {
      0% { opacity: 0.9; transform: scale(1) translateY(0); }
      50% { opacity: 0.6; }
      100% { opacity: 0; transform: scale(0.3) translate(var(--sp-tx), var(--sp-ty)); }
    }
    .bump-shake {
      animation: bumpShake 300ms ease-out !important;
    }
    @keyframes bumpShake {
      0%, 100% { margin-left: 0; }
      15% { margin-left: -6px; }
      30% { margin-left: 6px; }
      45% { margin-left: -4px; }
      60% { margin-left: 4px; }
      75% { margin-left: -2px; }
    }
    .bump-exclaim {
      position: absolute;
      pointer-events: none;
      font-size: 20px;
      font-weight: bold;
      color: #f87171;
      text-shadow: 0 0 6px rgba(248, 113, 113, 0.6);
      animation: exclaimPop 0.5s ease-out forwards;
    }
    @keyframes exclaimPop {
      0% { opacity: 0; transform: scale(0.2); }
      20% { opacity: 1; transform: scale(1.4); }
      100% { opacity: 0; transform: scale(0.8) translateY(-15px); }
    }
    #parade-container.fade-out {
      animation: fadeOutAll 500ms ease-out forwards;
    }
    @keyframes fadeOutAll {
      from { opacity: 1; }
      to { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="parade-container"></div>
  <script src="../_shared/effect-runtime.js"></script>
  <script>
    const { ipcRenderer } = require('electron');

    const COLOR_PALETTES = [
      // Pastel
      ['#f9a8d4', '#818cf8', '#f87171', '#86efac', '#fde68a', '#93c5fd', '#c084fc', '#fb923c'],
      // Ocean
      ['#67e8f9', '#93c5fd', '#a78bfa', '#818cf8', '#6ee7b7', '#5eead4', '#7dd3fc', '#c4b5fd'],
      // Sunset
      ['#fb923c', '#f87171', '#fbbf24', '#f472b6', '#e879f9', '#f9a8d4', '#fdba74', '#fca5a5'],
      // Forest
      ['#86efac', '#a3e635', '#4ade80', '#34d399', '#fde68a', '#bef264', '#d9f99d', '#bbf7d0'],
      // Neon
      ['#e879f9', '#c084fc', '#818cf8', '#f472b6', '#fb923c', '#a78bfa', '#f9a8d4', '#67e8f9'],
    ];

    const KAOMOJI_POOL = [
      '(=^・ω・^=)', '(=①ω①=)', '(=ｪ´=)', 'ฅ•̀∀•́ฅ',
      '(✪ω✪)', '(=￣ω￣=)', 'U•ェ•*U', '⊂(ο･㉨･ο)⊃',
      '(Θ３Θ)', '(*ΦωΦ*)', '(✧◡✧)', '(￣(∞)￣)',
      '(=^･･^=)', '(*^▽^*)', '(ꈍᴗꈍ)', '(=^𖥦^=)',
      "(●'ω')旦", '(=ｪ´=)ゞ', 'Σ(っ°Д°;)っ', '凸ˋ_ˊ#',
      '(ง •_•)ง', 'ψ(｀∇´)ψ', '(▼ヘ▼#)', 'o(≧口≦)o',
      '(•́へ•́╬)', '(ꈍᴗꈍ)', 'ᕙ༼ ͝°益° ༽ᕗ'
    ];

    // Roles
    const ROLE_LEADER = 'leader';
    const ROLE_FLAG_BEARER = 'flag_bearer';
    const ROLE_STRAGGLER = 'straggler';
    const ROLE_CONFUSED = 'confused';
    const ROLE_REGULAR = 'regular';

    const MARCH_FREQUENCY = 8;

    // Formation shapes
    const FORMATIONS = ['grid', 'wedge', 'diagonal', 'scattered', 'block', 'wide'];

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function rand(min, max) { return min + Math.random() * (max - min); }

    ipcRenderer.on('show-parade', (event, data) => {
      const duration = (data && data.duration) || 16000;
      startParade(duration);
    });

    function startParade(duration) {
      const runtime = EffectRuntime.createRuntime({
        id: 'parade',
        adaptiveQuality: true,
        minQuality: 0.55,
        targetFps: 60
      });
      const container = document.getElementById('parade-container');
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;

      // === Direction system: 8 directions ===
      const DIRECTIONS = [
        { dx:  1, dy:  0 },  // → right
        { dx: -1, dy:  0 },  // ← left
        { dx:  0, dy:  1 },  // ↓ down
        { dx:  0, dy: -1 },  // ↑ up
        { dx:  1, dy:  1 },  // ↘ down-right
        { dx: -1, dy:  1 },  // ↙ down-left
        { dx:  1, dy: -1 },  // ↗ up-right
        { dx: -1, dy: -1 },  // ↖ up-left
      ];
      const { dx, dy } = pick(DIRECTIONS);
      const isHoriz = dy === 0;
      const isVert  = dx === 0;

      // Normalized travel basis. All formation coordinates are built from these
      // two axes so diagonal parades rotate as a real formation.
      const dirLen = Math.hypot(dx, dy) || 1;
      const dirX = dx / dirLen;
      const dirY = dy / dirLen;
      const crossX = -dirY;
      const crossY = dirX;

      // === Formation dimensions (adapt to direction) ===
      let formationWidth, formationHeight;
      if (isVert) {
        formationWidth  = screenWidth  * rand(0.65, 0.8);
        formationHeight = screenHeight * rand(0.35, 0.5);
      } else if (isHoriz) {
        formationWidth  = screenWidth  * rand(0.78, 0.92);
        formationHeight = screenHeight * rand(0.62, 0.82);
      } else {
        formationWidth  = screenWidth  * rand(0.5, 0.65);
        formationHeight = screenHeight * rand(0.35, 0.5);
      }

      // Grid base offset: positions the formation in the perpendicular direction
      // Horizontal travel → offset Y ; Vertical travel → offset X ; Diagonal → no offset
      let gridBaseX = 0, gridBaseY = 0;
      if (isHoriz)      gridBaseY = screenHeight * rand(0.06, 0.12);
      else if (isVert)  gridBaseX = screenWidth  * rand(0.1, 0.25);

      // Formation shape
      const formation = pick(FORMATIONS);
      // Color palette
      const palette = pick(COLOR_PALETTES);
      // 9×10 main formation
      const ROWS = 10;
      const COLS = 9;
      const ROW_SPACING = formationHeight / (ROWS - 1);
      const COL_SPACING = formationWidth / (COLS - 1);
      // March speed variation
      const marchFreq = rand(3.2, 5.4);
      const baseAmplitude = rand(5, 11);
      const baseFontSize = Math.min(42, Math.max(24, formationWidth / COLS * rand(0.42, 0.58)));
      const leaderFontSize = baseFontSize + rand(8, 16);
      // Flag symbols
      const flagSymbols = ['♡', '★', '✧', '♪', '✿', '☆', '❁', '♫'];

      // Pick unique kaomoji and shuffle
      const shuffled = [...KAOMOJI_POOL].sort(() => Math.random() - 0.5);
      const total = ROWS * COLS; // 90
      const picked = [];
      for (let i = 0; i < total; i++) {
        picked.push(shuffled[i % shuffled.length]);
      }

      // Assign roles randomly (pick random positions for special roles)
      const allPositions = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS && allPositions.length < total; c++) {
          allPositions.push({ r, c });
        }
      }
      const shuffledPos = [...allPositions].sort(() => Math.random() - 0.5);
      const roleMap = {};
      let posIdx = 0;
      // Leader: front row random column
      roleMap[`${shuffledPos[posIdx].r},${shuffledPos[posIdx].c}`] = ROLE_LEADER;
      posIdx++;
      // Flag bearers: 3-4 random positions
      const numFlagBearers = Math.floor(rand(6, 10));
      for (let i = 0; i < numFlagBearers; i++) {
        roleMap[`${shuffledPos[posIdx].r},${shuffledPos[posIdx].c}`] = ROLE_FLAG_BEARER;
        posIdx++;
      }
      // Stragglers: 2-3 random positions
      const numStragglers = Math.floor(rand(5, 8));
      for (let i = 0; i < numStragglers; i++) {
        roleMap[`${shuffledPos[posIdx].r},${shuffledPos[posIdx].c}`] = ROLE_STRAGGLER;
        posIdx++;
      }
      // Confused: 2-3 random positions
      const numConfused = Math.floor(rand(5, 8));
      for (let i = 0; i < numConfused; i++) {
        roleMap[`${shuffledPos[posIdx].r},${shuffledPos[posIdx].c}`] = ROLE_CONFUSED;
        posIdx++;
      }

      const halfFormW = (COLS - 1) * COL_SPACING / 2;
      const halfFormH = (ROWS - 1) * ROW_SPACING / 2;

      // Formation center in screen coordinates before the travel offset is applied.
      const fcGx = isHoriz ? gridBaseX + halfFormW : isVert ? gridBaseX + halfFormH : screenWidth * 0.5;
      const fcGy = isHoriz ? gridBaseY + halfFormH : isVert ? gridBaseY + halfFormH : screenHeight * 0.5;

      function toFormationPoint(localAlong, localCross) {
        return {
          gx: fcGx + dirX * localAlong + crossX * localCross,
          gy: fcGy + dirY * localAlong + crossY * localCross
        };
      }

      // Compute grid positions in formation-local coordinates, then rotate them
      // into screen space according to the chosen direction.
      function getGridPos(r, c) {
        const halfCols = (COLS - 1) / 2;
        const halfRows = (ROWS - 1) / 2;
        let localAlong = (c - halfCols) * COL_SPACING;
        let localCross = (r - halfRows) * ROW_SPACING;
        if (formation === 'wedge') {
          localAlong = (r - halfRows) * ROW_SPACING * 0.7 - Math.abs(c - halfCols) * COL_SPACING * 0.35;
          localCross = (c - halfCols) * COL_SPACING * 1.1;
        } else if (formation === 'diagonal') {
          localAlong += (r - halfRows) * 35;
        } else if (formation === 'scattered') {
          localAlong += rand(-15, 15);
          localCross += rand(-8, 8);
        } else if (formation === 'block') {
          localAlong += (r % 2) * COL_SPACING * 0.18;
        } else if (formation === 'wide') {
          localAlong *= 0.9;
          localCross = (r - halfRows) * ROW_SPACING * 1.25 + Math.sin(c * 0.7) * 8;
        }
        return toFormationPoint(localAlong, localCross);
      }

      // Build marcher objects
      const marchers = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS && marchers.length < total; c++) {
          const idx = r * COLS + c;
          const roleKey = `${r},${c}`;
          const role = roleMap[roleKey] || ROLE_REGULAR;
          const color = palette[(idx + r + Math.floor(c / 2)) % palette.length];
          let fontSize = baseFontSize + rand(-3, 3);
          if (role === ROLE_LEADER) fontSize = leaderFontSize;

          const { gx, gy } = getGridPos(r, c);

          const el = document.createElement('div');
          el.className = 'marcher';
          el.textContent = picked[idx];
          el.style.fontSize = fontSize + 'px';
          el.style.color = color;
          el.style.textShadow = `0 0 15px ${color}`;
          el.style.opacity = '0';
          // Random slight rotation for personality
          if (role === ROLE_REGULAR) {
            el.style.transform = `rotate(${rand(-3, 3)}deg)`;
          }
          container.appendChild(el);

          // Flag element for flag bearers
          let flagEl = null;
          if (role === ROLE_FLAG_BEARER) {
            flagEl = document.createElement('div');
            flagEl.className = 'flag-symbol';
            const flagInner = document.createElement('span');
            flagInner.className = 'flag-inner';
            flagInner.textContent = pick(flagSymbols);
            flagEl.appendChild(flagInner);
            flagEl.style.color = color;
            flagEl.style.textShadow = `0 0 10px ${color}`;
            flagEl.style.opacity = '0';
            container.appendChild(flagEl);
          }

          marchers.push({
            el,
            flagEl,
            row: r,
            col: c,
            role,
            color,
            fontSize,
            gridX: gx,
            gridY: gy,
            enterDelay: idx * rand(8, 22),
            // Random individual march offset for organic feel
            marchPhase: rand(0, Math.PI * 2),
            amplitude: baseAmplitude + rand(-2, 3),
            // State for special roles
            stragglerPanicked: false,
            stragglerPanicShown: false,
            confusedBumped: false,
            confusedBumpShown: false,
          });
        }
      }

      // === Honor Guard (仪仗队): 4 soldiers in 1+3 pattern, leading the parade ===
      // Gap between formation edge and honor guard
      const honorGuardGap = Math.max(formationWidth, formationHeight) * 0.25 + rand(40, 80);
      const hgGap = Math.max(COL_SPACING, ROW_SPACING) * 1.2;

      // Distance from formation center to its edge in the travel direction
      const edgeDist = halfFormW;

      // Honor guard center: beyond the formation edge
      const hgCenterGx = fcGx + dirX * (edgeDist + honorGuardGap);
      const hgCenterGy = fcGy + dirY * (edgeDist + honorGuardGap);

      // Leader: even further in the direction of travel
      const leaderGx = hgCenterGx + dirX * hgGap;
      const leaderGy = hgCenterGy + dirY * hgGap;

      // 3 followers: behind the leader, spread perpendicular to travel direction
      const perpSpread = Math.max(halfFormW, halfFormH) * 0.35;
      const hgPositions = [
        { gx: leaderGx, gy: leaderGy },  // Leader at front
        { gx: hgCenterGx + crossX * perpSpread, gy: hgCenterGy + crossY * perpSpread },
        { gx: hgCenterGx, gy: hgCenterGy },
        { gx: hgCenterGx - crossX * perpSpread, gy: hgCenterGy - crossY * perpSpread },
      ];

      const hgColors = ['#fde68a', '#fbbf24', '#f59e0b', '#fcd34d'];
      const hgTexts = ['ฅ•̀∀•́ฅ', '(ง •_•)ง', 'ψ(｀∇´)ψ', '(=^・ω・^=)'];
      for (let i = 0; i < 4; i++) {
        const el = document.createElement('div');
        el.className = 'marcher';
        el.textContent = hgTexts[i];
        el.style.fontSize = (leaderFontSize + 4) + 'px';
        el.style.color = hgColors[i];
        el.style.textShadow = `0 0 18px ${hgColors[i]}`;
        el.style.opacity = '0';
        el.style.fontWeight = 'bold';
        container.appendChild(el);
        marchers.push({
          el,
          flagEl: null,
          row: -1,
          col: i,
          role: 'honor_guard',
          color: hgColors[i],
          fontSize: leaderFontSize + 4,
          gridX: hgPositions[i].gx,
          gridY: hgPositions[i].gy,
          enterDelay: 0, // Appear immediately
          marchPhase: rand(0, Math.PI * 2),
          amplitude: baseAmplitude + 4,
          stragglerPanicked: false,
          stragglerPanicShown: false,
          confusedBumped: false,
          confusedBumpShown: false,
        });
      }

      // Main formation appears after honor guard has been visible for a moment
      const mainFormationDelay = 400;
      marchers.forEach(m => {
        if (m.role !== 'honor_guard') {
          m.enterDelay += mainFormationDelay;
        }
      });

      // === Start / End positions for the travel path ===
      // Rearmost grid position (formation tail, opposite corner from travel direction)
      const rearGx = fcGx - dirX * halfFormW;
      const rearGy = fcGy - dirY * halfFormW;

      // Frontmost (leader) enters from the screen edge in the travel direction
      // Tail exits past the opposite edge
      // For axes not in the travel direction, base stays at 0 (grid positions handle placement)
      const startX = dx !== 0 ? ((dx > 0 ? -20 : screenWidth + 20) - leaderGx) : 0;
      const startY = dy !== 0 ? ((dy > 0 ? -20 : screenHeight + 20) - leaderGy) : 0;
      const endX   = dx !== 0 ? ((dx > 0 ? screenWidth + 100 : -100) - rearGx) : 0;
      const endY   = dy !== 0 ? ((dy > 0 ? screenHeight + 100 : -100) - rearGy) : 0;

      let startTime = null;
      let animDone = false;
      let dustTimer = 0;
      let noteTimer = 0;
      const fxPools = new Map();

      function acquireFxEl(className) {
        const pool = fxPools.get(className) || [];
        fxPools.set(className, pool);
        const el = pool.pop() || document.createElement('div');
        el.className = '';
        el.removeAttribute('style');
        el.style.display = 'block';
        container.appendChild(el);
        void el.offsetWidth;
        el.className = className;
        return el;
      }

      function releaseFxEl(className, el) {
        if (!el || !el.parentNode) return;
        el.style.display = 'none';
        el.textContent = '';
        el.className = '';
        const pool = fxPools.get(className) || [];
        fxPools.set(className, pool);
        if (pool.length < 80) pool.push(el);
        else el.remove();
      }

      // Find references to special marchers (now multiple of each)
      const stragglers = marchers.filter(m => m.role === ROLE_STRAGGLER);
      const confusedMarchers = marchers.filter(m => m.role === ROLE_CONFUSED);
      // Find marchers directly above each confused one (for bump interaction)
      const aboveConfusedMap = new Map();
      confusedMarchers.forEach(cm => {
        const above = marchers.find(m => m.row === cm.row - 1 && m.col === cm.col);
        if (above) aboveConfusedMap.set(cm, above);
      });

      function spawnDust(x, y, color) {
        if (!runtime.chance(0.85)) return;
        const dust = acquireFxEl('dust-particle');
        const size = 3 + Math.random() * 3;
        dust.style.width = size + 'px';
        dust.style.height = size + 'px';
        dust.style.left = (x - size / 2) + 'px';
        dust.style.top = (y - size / 2) + 'px';
        dust.style.background = color;
        dust.style.opacity = '0.4';
        setTimeout(() => releaseFxEl('dust-particle', dust), 520);
      }

      function spawnMusicNote(x, y, color) {
        if (!runtime.chance(0.8)) return;
        const note = acquireFxEl('music-note');
        const notes = ['♪', '♫', '♬'];
        note.textContent = notes[Math.floor(Math.random() * notes.length)];
        note.style.left = x + 'px';
        note.style.top = y + 'px';
        note.style.color = color;
        note.style.textShadow = `0 0 8px ${color}`;
        note.style.setProperty('--note-tx', (Math.random() * 20 - 10) + 'px');
        setTimeout(() => releaseFxEl('music-note', note), 1220);
      }

      function spawnPanicMark(x, y) {
        const mark = acquireFxEl('panic-mark');
        mark.textContent = '!!!';
        mark.style.left = x + 'px';
        mark.style.top = y + 'px';
        setTimeout(() => releaseFxEl('panic-mark', mark), 620);
      }

      function spawnBumpExclaim(x, y) {
        const ex = acquireFxEl('bump-exclaim');
        ex.textContent = '!';
        ex.style.left = x + 'px';
        ex.style.top = y + 'px';
        setTimeout(() => releaseFxEl('bump-exclaim', ex), 520);
      }

      function spawnHonorSparkle(x, y, color) {
        const sp = acquireFxEl('honor-sparkle');
        const size = 3 + Math.random() * 4;
        sp.style.width = size + 'px';
        sp.style.height = size + 'px';
        sp.style.left = (x + (Math.random() - 0.5) * 20) + 'px';
        sp.style.top = (y + (Math.random() - 0.5) * 10) + 'px';
        sp.style.background = color;
        sp.style.boxShadow = `0 0 6px ${color}`;
        sp.style.setProperty('--sp-tx', (Math.random() * 30 - 15) + 'px');
        sp.style.setProperty('--sp-ty', (-10 - Math.random() * 20) + 'px');
        setTimeout(() => releaseFxEl('honor-sparkle', sp), 820);
      }

      function getMarcherPosition(marcher, baseXVal, baseYVal, progress, time) {
        let offsetX = 0;
        let offsetY = 0;

        // Leader is slightly ahead in the travel direction.
        if (marcher.role === ROLE_LEADER) {
          offsetX = dirX * 30;
          offsetY = dirY * 30;
          marcher.amplitude = baseAmplitude + 6;
        }

        // March bob is perpendicular to the travel direction, so diagonal motion
        // does not collapse back into screen-vertical bouncing.
        const bob = Math.sin(time * marchFreq + marcher.marchPhase) * marcher.amplitude;

        let finalX = baseXVal + marcher.gridX + offsetX + crossX * bob;
        let finalY = baseYVal + marcher.gridY + offsetY + crossY * bob;

        // Straggler behavior: falls behind in the travel direction
        if (marcher.role === ROLE_STRAGGLER) {
          const fallDist = rand(100, 170);
          if (progress < 0.3) {
            // Normal march
          } else if (progress < 0.6) {
            const slowPhase = (progress - 0.3) / 0.3;
            finalX += (-dirX) * slowPhase * fallDist;
            finalY += (-dirY) * slowPhase * fallDist;
          } else if (progress < 0.65) {
            marcher.stragglerPanicked = true;
            const sprintPhase = (progress - 0.6) / 0.05;
            finalX += (-dirX) * (fallDist - sprintPhase * (fallDist + 30));
            finalY += (-dirY) * (fallDist - sprintPhase * (fallDist + 30));
          } else if (progress < 0.75) {
            const settlePhase = (progress - 0.65) / 0.1;
            finalX += dirX * (30 - settlePhase * 30);
            finalY += dirY * (30 - settlePhase * 30);
          }
        }

        // Confused behavior: drifts perpendicular to travel direction, bumps into neighbor
        if (marcher.role === ROLE_CONFUSED) {
          if (progress > 0.25 && progress < 0.4) {
            const driftPhase = (progress - 0.25) / 0.15;
            finalX += crossX * driftPhase * ROW_SPACING;
            finalY += crossY * driftPhase * ROW_SPACING;
          } else if (progress >= 0.4 && progress < 0.42) {
            finalX += crossX * ROW_SPACING;
            finalY += crossY * ROW_SPACING;
            if (!marcher.confusedBumped) {
              marcher.confusedBumped = true;
            }
          } else if (progress >= 0.42 && progress < 0.5) {
            const wobblePhase = (progress - 0.42) / 0.08;
            const remaining = (1 - wobblePhase) * ROW_SPACING;
            const wobble = Math.sin(time * 20) * 5 * (1 - wobblePhase);
            finalX += crossX * (remaining * (1 - wobblePhase) + wobble);
            finalY += crossY * (remaining * (1 - wobblePhase) + wobble);
          }
        }

        return { x: finalX, y: finalY };
      }

      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const timeSeconds = elapsed / 1000;

        const baseXVal = startX + progress * (endX - startX);
        const baseYVal = startY + progress * (endY - startY);

        dustTimer += 1;
        noteTimer += 1;

        marchers.forEach(marcher => {
          const visible = elapsed >= marcher.enterDelay;
          if (!visible) return;

          const localElapsed = elapsed - marcher.enterDelay;
          const fadeIn = Math.min(localElapsed / 300, 1);

          const pos = getMarcherPosition(marcher, baseXVal, baseYVal, progress, timeSeconds);

          marcher.el.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
          marcher.el.style.opacity = fadeIn;

          if (marcher.flagEl) {
            const flagX = pos.x + crossX * marcher.fontSize * 0.3 - dirX * 8;
            const flagY = pos.y + crossY * marcher.fontSize * 0.3 - dirY * 8 - 18;
            marcher.flagEl.style.transform = `translate(${flagX}px, ${flagY}px)`;
            marcher.flagEl.style.opacity = fadeIn;
          }

          if (dustTimer % 8 === 0 && progress < 0.95 && (marcher.row + marcher.col) % 3 === dustTimer % 3) {
            spawnDust(pos.x + marcher.fontSize * 0.4, pos.y + marcher.fontSize * 0.8, marcher.color);
          }

          // Honor guard sparkle particles (occasional, not too many)
          if (marcher.role === 'honor_guard' && progress > 0.02 && progress < 0.95 && Math.random() < 0.12) {
            spawnHonorSparkle(pos.x + marcher.fontSize * 0.3, pos.y, marcher.color);
          }

          if (noteTimer % 60 === 0 && Math.random() < 0.15 && progress > 0.05 && progress < 0.9 && marcher.row === 0 && marcher.col % 3 === 0) {
            spawnMusicNote(pos.x + marcher.fontSize * 0.3, pos.y - 10, marcher.color);
          }

          if (marcher.role === ROLE_STRAGGLER && marcher.stragglerPanicked && !marcher.stragglerPanicShown) {
            marcher.stragglerPanicShown = true;
            spawnPanicMark(pos.x + marcher.fontSize * 0.3, pos.y - 12);
          }

          if (marcher.role === ROLE_CONFUSED && marcher.confusedBumped && !marcher.confusedBumpShown) {
            marcher.confusedBumpShown = true;
            spawnBumpExclaim(pos.x + marcher.fontSize * 0.4, pos.y - 10);
            marcher.el.classList.add('bump-shake');
            setTimeout(() => marcher.el.classList.remove('bump-shake'), 300);
            const aboveM = aboveConfusedMap.get(marcher);
            if (aboveM) {
              aboveM.el.classList.add('bump-shake');
              setTimeout(() => aboveM.el.classList.remove('bump-shake'), 300);
            }
          }
        });

        if (progress >= 1 && !animDone) {
          runtime.stop();
          animDone = true;
          container.classList.add('fade-out');
          setTimeout(() => window.close(), 500);
        }
      }

      runtime.requestEffectFrame(animate);
    }
  </script>
</body>
