<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      border: none;
      outline: none;
    }
    #giant {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 250px;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
      color: rgba(255, 200, 230, 0.7);
      text-shadow: 0 0 60px rgba(249, 168, 212, 0.5);
      white-space: nowrap;
      animation: giantAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                 giantFade 0.8s ease 2.5s forwards;
      opacity: 0;
      transform: scale(0);
    }
    @keyframes giantAppear {
      0% { opacity: 0; transform: scale(0) rotate(-10deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes giantFade {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.3); }
    }

    .egg-particle {
      position: absolute;
      pointer-events: none;
      animation: eggFloat 1.8s ease-out forwards;
      opacity: 0;
      font-size: 40px;
    }
    @keyframes eggFloat {
      0% { opacity: 1; transform: translate(0, 0) scale(0.3); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.5); }
    }
  </style>
</head>
<body>
  <div id="giant"></div>
  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('show-giant', (event, { kaomoji, color }) => {
      const el = document.getElementById('giant');
      el.textContent = kaomoji;
      if (color) {
        el.style.color = color;
        el.style.textShadow = `0 0 80px ${color}, 0 0 160px ${color}`;
      }

      // Spawn particles
      const symbols = ['♡', '✧', '★', '✦', '♥', '♪'];
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          const p = document.createElement('span');
          p.className = 'egg-particle';
          p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          const angle = Math.random() * Math.PI * 2;
          const dist = 200 + Math.random() * 400;
          p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
          p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
          p.style.left = '50%';
          p.style.top = '50%';
          p.style.color = color || '#f9a8d4';
          p.style.animationDelay = (Math.random() * 0.3) + 's';
          p.style.fontSize = (20 + Math.random() * 30) + 'px';
          document.body.appendChild(p);
        }, i * 30);
      }
    });
  </script>
</body>
</html>
